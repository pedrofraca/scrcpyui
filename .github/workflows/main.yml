# This is a basic workflow to help you get started with Actions

name: CI

# Create a release when a version tag is pushed.
on:
  push:
    tags: [ 'v*' ]

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release (for example, v1.3)
        required: true
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: macOS-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout Project
      uses: actions/checkout@v3
      with:
        ref: ${{ inputs.release_tag || github.ref }}
    - name: Testing
      run: xcodebuild -scheme scrcpyuiTests test
    - name: Archive
      run: xcodebuild -scheme scrcpyui archive -archivePath Build/Archive
    - name: Package
      run: hdiutil create -fs HFS+ -srcfolder "Build/Archive.xcarchive/Products/Applications" -volname "scrcpyui" "Build/scrcpyui.dmg"
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
      with:
        tag_name: ${{ inputs.release_tag || github.ref_name }}
        release_name: Release ${{ inputs.release_tag || github.ref_name }}
        body: |
          Changes in this Release
          - First Change
          - Second Change
        draft: false
        prerelease: false
    - name: Upload Release Asset
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
        asset_path: ./Build/scrcpyui.dmg
        asset_name: scrcpyui.dmg
        asset_content_type: application/x-apple-diskimage
